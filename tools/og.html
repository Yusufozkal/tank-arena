<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#262a1d;color:#efe7d2;font-family:"Barlow Condensed",sans-serif}
.bg{position:absolute;inset:0;background:url(/img/play-wide.jpg) 62% 50%/cover}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,#262a1d 30%,rgba(38,42,29,.88) 46%,rgba(38,42,29,.5) 72%,rgba(38,42,29,.4))}
.steel{position:absolute;left:0;right:0;bottom:0;height:40px;background:url("STEEL") 0 0/40px 40px repeat-x}
.txt{position:absolute;left:64px;top:70px}
h1{font-family:"Big Shoulders Stencil",sans-serif;font-weight:900;font-size:186px;line-height:.8}
h1 span{display:block}
p{margin-top:30px;font-size:38px;font-weight:600;line-height:1.15;max-width:520px}
.tag{display:inline-block;margin-top:26px;padding:10px 20px;border-radius:4px;background:#f2c14e;color:#1f2216;font-weight:700;font-size:32px}
.tank{position:absolute;right:120px;top:150px;width:300px;filter:drop-shadow(8px 10px 0 rgba(20,22,14,.45))}
</style></head><body>
<div class="bg"></div>
<div class="txt"><h1><span>TANK</span><span>ARENA</span></h1><p>Dalga dalga gelen tanklara karşı ayakta kal.</p><span class="tag">Tarayıcıda oyna, Android'e indir</span></div>
<img class="tank" src="/img/tank-player-upgraded.png" alt="">
<div class="steel"></div>
</body></html>
